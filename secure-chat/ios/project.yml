name: LocalAI
options:
  bundleIdPrefix: com.hun
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LocalAI:
    type: application
    platform: iOS
    sources:
      - LocalAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hun.localai
        DEVELOPMENT_TEAM: 8UUD85JPJ2
        INFOPLIST_FILE: LocalAI/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocalAI/Resources/LocalAI.entitlements
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "11"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_NAME: LocalAI
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - LocalAITests
  LocalAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - LocalAITests
    dependencies:
      - target: LocalAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hun.localai.tests
        GENERATE_INFOPLIST_FILE: YES
